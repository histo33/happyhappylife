<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Fit - 회원가입</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <h1 class="header__logo">Style Fit</h1>
            <nav class="header__nav">
                <a href="../index.html" class="header__link">Home</a>
                <a href="../index.html#test" class="header__link">Style Test</a>
                <a href="../index.html#recommendations" class="header__link">Recommendations</a>
                <a href="../index.html#explorer" class="header__link">Explorer</a>
            </nav>
        </div>
    </header>

    <main class="login-container">
        <div class="login-card">
            <div class="login-card__content">
                <p class="login-card__step">REGISTRATION</p>
                <h2 class="login-card__title">새로운 시작</h2>
                <p class="login-card__subtitle">당신만의 스타일 여정을 위해 계정을 만들어 보세요.</p>
                
                <form id="signupForm" class="login-form">
                    <div class="login-form__group">
                        <label for="reg-name" class="login-form__label">이름</label>
                        <input type="text" id="reg-name" name="name" class="login-form__input" placeholder="이름을 입력하세요" required>
                    </div>
                    <div class="login-form__group">
                        <label for="reg-email" class="login-form__label">이메일</label>
                        <input type="email" id="reg-email" name="email" class="login-form__input" placeholder="example@stylefit.com" required>
                    </div>
                    <div class="login-form__group">
                        <label for="reg-id" class="login-form__label">아이디</label>
                        <input type="text" id="reg-id" name="username" class="login-form__input" placeholder="사용할 아이디를 입력하세요" required>
                    </div>
                    <div class="login-form__group">
                        <label for="reg-password" class="login-form__label">비밀번호</label>
                        <input type="password" id="reg-password" name="password" class="login-form__input" placeholder="6자 이상의 비밀번호" required>
                    </div>
                    
                    <div class="login-form__options">
                        <label class="login-form__remember">
                            <input type="checkbox" name="terms" required> 이용약관 및 개인정보 처리방침에 동의합니다.
                        </label>
                    </div>
                    
                    <button type="submit" class="login-form__button">회원가입 완료</button>
                </form>

                <p class="login-card__signup">이미 계정이 있으신가요? <a href="login.html">로그인하기</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Style Fit. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
