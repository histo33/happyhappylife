<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Fit - 로그인</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <h1 class="header__logo">Style Fit</h1>
            <nav class="header__nav">
                <a href="../index.html" class="header__link">Home</a>
                <a href="../index.html#test" class="header__link">Style Test</a>
                <a href="../index.html#recommendations" class="header__link">Recommendations</a>
                <a href="../index.html#explorer" class="header__link">Explorer</a>
            </nav>
        </div>
    </header>

    <main class="login-container">
        <div class="login-card">
            <div class="login-card__content">
                <p class="login-card__step">LOGIN</p>
                <h2 class="login-card__title">환영합니다</h2>
                <p class="login-card__subtitle">당신만의 스타일을 찾기 위해 로그인해 주세요.</p>
                
                <form id="loginForm" class="login-form">
                    <div class="login-form__group">
                        <label for="username" class="login-form__label">아이디</label>
                        <input type="text" id="username" name="username" class="login-form__input" placeholder="아이디를 입력하세요" required>
                    </div>
                    <div class="login-form__group">
                        <label for="password" class="login-form__label">비밀번호</label>
                        <input type="password" id="password" name="password" class="login-form__input" placeholder="비밀번호를 입력하세요" required>
                    </div>
                    <div class="login-form__options">
                        <label class="login-form__remember">
                            <input type="checkbox" name="remember"> 아이디 저장
                        </label>
                        <a href="#" class="login-form__forgot">비밀번호를 잊으셨나요?</a>
                    </div>
                    <button type="submit" class="login-form__button">로그인</button>
                </form>

                <div class="login-card__social">
                    <p class="login-card__social-text">또는 소설 계정으로 로그인</p>
                    <div class="login-card__social-buttons">
                        <button class="social-btn social-btn--kakao">카카오</button>
                        <button class="social-btn social-btn--naver">네이버</button>
                        <button class="social-btn social-btn--google">구글</button>
                    </div>
                </div>

                <p class="login-card__signup">계정이 없으신가요? <a href="signup.html">회원가입</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Style Fit. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
